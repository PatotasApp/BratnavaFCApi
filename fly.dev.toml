app = "development-env"
primary_region = "iad"

[http_service]
  auto_start_machines = true
  auto_stop_machines = true
  min_machines_running = 0
  force_https = true
  internal_port = 8080
  processes = ["app"]

[http_service.concurrency]
  type = "connections"
  soft_limit = 20
  hard_limit = 25

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"