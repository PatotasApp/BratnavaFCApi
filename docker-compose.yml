services:
  postgres:
    image: postgres:17-alpine
    container_name: bratnava-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bratnavafc
      POSTGRES_USER: bratnava
      POSTGRES_PASSWORD: bratnava
    ports:
      - "5432:5432"
    volumes:
      - bratnava-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bratnava -d bratnavafc"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bratnava-postgres-data:
